<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
    <style>.m{font-family:Menlo,Consolas,monospace;font-size:14px}.s{font-size:13px;fill:#555}.b{font-weight:bold}.ln{stroke:#666;stroke-width:1.6;fill:none}</style>
  </defs>
  <rect width="860" height="360" fill="#fff"/>
  <rect x="30" y="30" width="200" height="64" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="58" text-anchor="middle" class="m">login()</text>
  <text x="130" y="80" text-anchor="middle" class="s">your service</text>
  <line x1="232" y1="62" x2="318" y2="62" class="ln" marker-end="url(#a)"/>
  <rect x="320" y="30" width="230" height="64" rx="8" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="435" y="58" text-anchor="middle" class="m">AuthenticationManager</text>
  <text x="435" y="80" text-anchor="middle" class="s">the front door</text>
  <line x1="552" y1="62" x2="608" y2="62" class="ln" marker-end="url(#a)"/>
  <rect x="610" y="30" width="230" height="64" rx="8" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="725" y="58" text-anchor="middle" class="m">AuthenticationProvider</text>
  <text x="725" y="80" text-anchor="middle" class="s">does the checking</text>

  <path d="M725,96 L725,120 L240,120 L240,166" class="ln" marker-end="url(#a)"/>
  <path d="M725,120 L620,120 L620,166" class="ln" marker-end="url(#a)"/>
  <text x="430" y="142" text-anchor="middle" class="s">the provider asks two questions</text>

  <rect x="90" y="168" width="300" height="90" rx="8" fill="#ecfdf3" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="196" text-anchor="middle" class="m">UserDetailsService</text>
  <text x="240" y="222" text-anchor="middle" class="b">"Who is this?"</text>
  <text x="240" y="245" text-anchor="middle" class="s">→ the AppUser from the database</text>

  <rect x="470" y="168" width="300" height="90" rx="8" fill="#f5f0ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="620" y="196" text-anchor="middle" class="m">PasswordEncoder</text>
  <text x="620" y="222" text-anchor="middle" class="b">"Does the password match?"</text>
  <text x="620" y="245" text-anchor="middle" class="s">→ yes or no</text>

  <text x="430" y="310" text-anchor="middle"><tspan class="b">Yes</tspan> → logged in, make the token    ·    <tspan class="b">No</tspan> → 401</text>
</svg>
