<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

  <text x="200" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">In Java — objects</text>
  <text x="665" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">In H2 — tables</text>
  <line x1="430" y1="20" x2="430" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Recipe object -->
  <rect x="40" y="60" width="320" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="60" y="88" font-size="17" font-weight="700" fill="#1e3a8a">Recipe  @Entity</text>
  <text x="60" y="114" font-size="14" fill="#334155" font-family="ui-monospace, Menlo, monospace">id        = 1</text>
  <text x="60" y="136" font-size="14" fill="#334155" font-family="ui-monospace, Menlo, monospace">title     = "Lok Lak"</text>
  <text x="60" y="158" font-size="14" fill="#334155" font-family="ui-monospace, Menlo, monospace">cuisine   = "khmer"</text>
  <text x="60" y="180" font-size="14" fill="#334155" font-family="ui-monospace, Menlo, monospace">minutes   = 25  ·  servings = 2</text>
  <text x="60" y="210" font-size="14" fill="#1e3a8a" font-weight="700" font-family="ui-monospace, Menlo, monospace">ingredients = [ ●  ●  ● ]</text>

  <!-- Ingredient objects -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <rect x="40"  y="300" width="100" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="52" y="322" font-weight="700" fill="#166534" font-family="system-ui, sans-serif">Ingredient</text>
    <text x="52" y="344" fill="#334155">"beef"</text>
    <text x="52" y="366" fill="#b91c1c" font-weight="700">recipe ●</text>

    <rect x="150" y="300" width="100" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="162" y="322" font-weight="700" fill="#166534" font-family="system-ui, sans-serif">Ingredient</text>
    <text x="162" y="344" fill="#334155">"lettuce"</text>
    <text x="162" y="366" fill="#b91c1c" font-weight="700">recipe ●</text>

    <rect x="260" y="300" width="100" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="272" y="322" font-weight="700" fill="#166534" font-family="system-ui, sans-serif">Ingredient</text>
    <text x="272" y="344" fill="#334155">"lime"</text>
    <text x="272" y="366" fill="#b91c1c" font-weight="700">recipe ●</text>
  </g>
  <!-- list arrows -->
  <line x1="200" y1="230" x2="90"  y2="298" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="200" y1="230" x2="200" y2="298" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="200" y1="230" x2="310" y2="298" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="208" y="256" font-size="11.5" font-style="italic" fill="#475569">@OneToMany(mappedBy = "recipe")</text>
  <text x="208" y="272" font-size="11.5" font-style="italic" fill="#475569">the mirror — writes nothing</text>

  <!-- back reference note -->
  <text x="40" y="420" font-size="13" fill="#b91c1c" font-weight="700">recipe ● points back at the Recipe above</text>
  <text x="40" y="440" font-size="13" fill="#b91c1c">@ManyToOne — the OWNING side.</text>
  <text x="40" y="460" font-size="13" fill="#b91c1c">This field is what becomes recipe_id.</text>
  <text x="40" y="500" font-size="13" fill="#475569">recipe.addIngredient("lime") sets both:</text>
  <text x="40" y="520" font-size="13" fill="#475569">it adds to the list AND fills in recipe ●.</text>

  <!-- recipes table -->
  <g font-size="13">
    <rect x="470" y="60" width="400" height="30" fill="#1e3a8a"/>
    <text x="482" y="80" fill="#ffffff" font-weight="700">recipes</text>
    <rect x="470" y="90" width="400" height="28" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="482" y="109" fill="#1e293b" font-weight="700">id</text>
    <text x="530" y="109" fill="#1e293b" font-weight="700">title</text>
    <text x="640" y="109" fill="#1e293b" font-weight="700">cuisine</text>
    <text x="720" y="109" fill="#1e293b" font-weight="700">minutes</text>
    <text x="800" y="109" fill="#1e293b" font-weight="700">servings</text>
    <rect x="470" y="118" width="400" height="28" fill="#ffffff" stroke="#93c5fd"/>
    <text x="482" y="137" fill="#334155">1</text>
    <text x="530" y="137" fill="#334155">Lok Lak</text>
    <text x="640" y="137" fill="#334155">khmer</text>
    <text x="720" y="137" fill="#334155">25</text>
    <text x="800" y="137" fill="#334155">2</text>
  </g>

  <!-- ingredients table -->
  <g font-size="13">
    <rect x="470" y="300" width="400" height="30" fill="#166534"/>
    <text x="482" y="320" fill="#ffffff" font-weight="700">ingredients</text>
    <rect x="470" y="330" width="400" height="28" fill="#dcfce7" stroke="#86efac"/>
    <text x="482" y="349" fill="#1e293b" font-weight="700">id</text>
    <text x="560" y="349" fill="#1e293b" font-weight="700">name</text>
    <text x="720" y="349" fill="#b91c1c" font-weight="700">recipe_id  (FK)</text>
    <rect x="470" y="358" width="400" height="28" fill="#ffffff" stroke="#86efac"/>
    <text x="482" y="377" fill="#334155">1</text><text x="560" y="377" fill="#334155">beef</text><text x="720" y="377" fill="#b91c1c" font-weight="700">1</text>
    <rect x="470" y="386" width="400" height="28" fill="#ffffff" stroke="#86efac"/>
    <text x="482" y="405" fill="#334155">2</text><text x="560" y="405" fill="#334155">lettuce</text><text x="720" y="405" fill="#b91c1c" font-weight="700">1</text>
    <rect x="470" y="414" width="400" height="28" fill="#ffffff" stroke="#86efac"/>
    <text x="482" y="433" fill="#334155">3</text><text x="560" y="433" fill="#334155">lime</text><text x="720" y="433" fill="#b91c1c" font-weight="700">1</text>
  </g>

  <!-- FK arrow from recipe_id column to recipes.id -->
  <path d="M 860 372 C 895 300, 895 180, 866 140" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="660" y="250" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">every row points at its recipe</text>
  <text x="660" y="270" font-size="13" fill="#475569" text-anchor="middle">a table has no lists — the list is rebuilt</text>
  <text x="660" y="288" font-size="13" fill="#475569" text-anchor="middle">by asking "which rows have recipe_id = 1?"</text>

  <!-- object -> row arrows -->
  <line x1="362" y1="130" x2="466" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="362" y1="346" x2="466" y2="400" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="470" y="480" width="400" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="486" y="505" font-size="13" fill="#1e293b" font-weight="700">One object → one row</text>
  <text x="486" y="527" font-size="13" fill="#475569">A field → a column · the id → the primary key</text>
  <text x="486" y="549" font-size="13" fill="#475569">A reference to another object → a foreign key</text>
</svg>
