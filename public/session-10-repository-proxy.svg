<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="700" fill="#ffffff"/>

  <!-- controller -->
  <rect x="200" y="20" width="460" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="430" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">RecipeController</text>
  <text x="430" y="70" text-anchor="middle" font-size="13" fill="#475569">unchanged since last session</text>
  <line x1="430" y1="84" x2="430" y2="118" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="444" y="106" font-size="12" font-style="italic" fill="#334155">recipeService.findAll(null)</text>

  <!-- service proxy -->
  <rect x="120" y="124" width="620" height="126" rx="12" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="140" y="148" font-size="14" font-weight="700" fill="#334155">RecipeServiceImpl$$SpringCGLIB$$0 — generated</text>
  <text x="140" y="166" font-size="12" fill="#64748b">runs your aspect's log line and, on writes, opens and commits the transaction</text>
  <rect x="220" y="178" width="420" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="430" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">RecipeServiceImpl</text>
  <text x="430" y="224" text-anchor="middle" font-size="12" fill="#475569">your code · @Transactional on create, replace, delete</text>
  <line x1="430" y1="250" x2="430" y2="288" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="444" y="274" font-size="12" font-style="italic" fill="#334155">recipeRepository.findAll()</text>

  <!-- repository proxy -->
  <rect x="120" y="294" width="620" height="140" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="140" y="320" font-size="14" font-weight="700" fill="#9a3412">jdk.proxy2.$Proxy223 — generated by Spring Data at startup (the number varies)</text>
  <text x="140" y="338" font-size="12" fill="#9a3412">implements your RecipeRepository interface · no class of yours behind it</text>
  <g font-size="12" fill="#7c2d12">
    <rect x="150" y="352" width="180" height="66" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="240" y="374" text-anchor="middle" font-weight="700">inherited</text>
    <text x="240" y="392" text-anchor="middle">findAll · findById · save</text>
    <text x="240" y="408" text-anchor="middle">existsById · deleteById</text>
    <rect x="340" y="352" width="180" height="66" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="430" y="374" text-anchor="middle" font-weight="700">derived</text>
    <text x="430" y="392" text-anchor="middle">findByCuisineIgnoreCase</text>
    <text x="430" y="408" text-anchor="middle">SQL from the NAME</text>
    <rect x="530" y="352" width="180" height="66" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="620" y="374" text-anchor="middle" font-weight="700">@Query</text>
    <text x="620" y="392" text-anchor="middle">findByIngredient</text>
    <text x="620" y="408" text-anchor="middle">JPQL you wrote</text>
  </g>
  <line x1="430" y1="434" x2="430" y2="468" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- hibernate -->
  <rect x="200" y="474" width="460" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="430" y="498" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Hibernate — the EntityManager</text>
  <text x="430" y="518" text-anchor="middle" font-size="12" fill="#166534">writes the SQL from your @Entity classes</text>
  <line x1="430" y1="530" x2="430" y2="560" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="444" y="550" font-size="12" font-style="italic" fill="#334155">borrow a connection from HikariCP</text>

  <!-- database -->
  <rect x="150" y="566" width="560" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="430" y="592" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">H2 — recipes · ingredients · DATABASECHANGELOG</text>
  <text x="430" y="614" text-anchor="middle" font-size="12" fill="#475569">tables built by Liquibase · Hibernate only validates them</text>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="120" y="650" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="142" y="663">your code</text>
    <rect x="240" y="650" width="16" height="16" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/><text x="262" y="663">CGLIB proxy (a subclass)</text>
    <rect x="440" y="650" width="16" height="16" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="462" y="663">JDK proxy (an interface, no class)</text>
    <rect x="680" y="650" width="16" height="16" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="702" y="663">Hibernate</text>
  </g>
</svg>
