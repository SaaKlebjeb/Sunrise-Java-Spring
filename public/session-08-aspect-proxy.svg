<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 680" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="680" fill="#ffffff"/>

  <!-- Controller box -->
  <rect x="230" y="20" width="360" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="410" y="54" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Controller</text>
  <text x="410" y="80" text-anchor="middle" font-size="14" fill="#475569">holds a RecipeService reference</text>

  <!-- Arrow: controller -> proxy -->
  <line x1="410" y1="106" x2="410" y2="168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="142" font-size="13" font-style="italic" fill="#334155">recipeService.create(recipe)</text>

  <!-- Outer dashed proxy box -->
  <rect x="70" y="176" width="680" height="380" rx="14" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="94" y="206" font-size="15" font-weight="700" fill="#334155">Proxy object — RecipeServiceImpl$$SpringCGLIB$$0</text>
  <text x="94" y="227" font-size="12" fill="#64748b">generated at startup · extends RecipeServiceImpl · did not exist when you compiled</text>

  <!-- Advice box -->
  <rect x="130" y="246" width="560" height="112" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="410" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">ServiceCallAspect.logCall(joinPoint)</text>
  <text x="410" y="307" text-anchor="middle" font-size="14" fill="#9a3412">your aspect&#8217;s advice runs first</text>
  <text x="410" y="329" text-anchor="middle" font-size="13" font-style="italic" fill="#9a3412">log.info("service:{}", joinPoint.getSignature().getName())</text>

  <!-- Arrow: advice -> real method -->
  <line x1="410" y1="358" x2="410" y2="422" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="394" font-size="13" font-style="italic" fill="#334155">joinPoint.proceed() → super.create(recipe)</text>

  <!-- Real method box -->
  <rect x="130" y="432" width="560" height="112" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="468" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">RecipeServiceImpl.create(recipe) { ... }</text>
  <text x="410" y="493" text-anchor="middle" font-size="14" fill="#166534">the method you actually wrote</text>
  <text x="410" y="515" text-anchor="middle" font-size="13" font-style="italic" fill="#166534">runs exactly as before — it has no idea anything wrapped it</text>

  <!-- Return note -->
  <text x="410" y="590" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">The return value — and any exception — flows back up through the same path, in reverse.</text>

  <!-- Legend -->
  <rect x="60" y="612" width="24" height="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="625" font-size="13" fill="#334155">your calling code</text>

  <rect x="330" y="612" width="24" height="16" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="362" y="625" font-size="13" fill="#334155">generated by Spring at startup</text>

  <rect x="60" y="642" width="24" height="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="92" y="655" font-size="13" fill="#334155">the aspect&#8217;s advice</text>

  <rect x="330" y="642" width="24" height="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="362" y="655" font-size="13" fill="#334155">your original method body (inherited)</text>
</svg>
